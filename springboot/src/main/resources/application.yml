spring:
  application:
    name: springboot
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/heritage_db?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  
  # 安全配置
  security:
    user:
      name: ${BASIC_AUTH_USERNAME:disabled}
      password: ${BASIC_AUTH_PASSWORD:}
  main:
    allow-bean-definition-overriding: true
  # 邮件配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: utf-8
    port: ${MAIL_PORT:465}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
            protocols: TLSv1.2
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
  
  # Web配置
  mvc:
    static-path-pattern: /**  # 允许根路径访问静态资源
  web:
    resources:
      static-locations: classpath:/static/, file:./files/  # 添加files目录
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_SIZE:100MB}
  
  # JSON配置
  jackson:
    default-property-inclusion: non_empty
# 服务器配置
server:
  port: 8889
  servlet:
    context-path: /

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

# 版本化数据库迁移。开发环境仍可通过 SQL_INIT_MODE 兼容旧表初始化，生产环境应关闭 SQL_INIT_MODE。
# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  enable-spring-security: false
  paths-to-match: /**
  packages-to-scan: org.example.springboot

# Knife4j配置
knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn
  basic:
    enable: true
    username: ${BASIC_AUTH_USERNAME:disabled}
    password: ${KNIFE4J_PASSWORD:}

# JWT配置
jwt:
  secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时（毫秒）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀


# 文件管理配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./files}
    maxSize: ${MAX_UPLOAD_BYTES:104857600}  # 默认 100MB，可由环境变量收紧

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/v1/chat/completions}
